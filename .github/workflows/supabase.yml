# Applies new database migrations (supabase/migrations/*.sql) and deploys edge
# functions whenever they change on main, so nobody has to paste SQL by hand.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    – the <ref> in https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD   – Project Settings → Database (reset it there if unknown)
name: Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # Until the secrets are added, skip quietly instead of failing every push
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets not set yet; skipping. Run new SQL in supabase/migrations by hand for now."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Apply new migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push
      - name: Deploy edge functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy fetch-page --project-ref "$PROJECT_ID"
